<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Fallback SEO tags for crawlers/link-preview bots that don't execute JS. This is
      a client-rendered SPA, so react-helmet-async (src/features/common/seo/seo.tsx)
      overrides title/description/OG per route at runtime for JS-capable clients
      (Google, browsers). Non-JS bots hitting any route see these generic defaults.
    -->
    <meta name="description" content="Sebastián Hernando — Solutions Architect y Full-Stack Developer. Next.js, Python y AWS: productos en producción usados por bancos y empresas en Australia y Panamá." />
    <title>Sebastián Hernando — Solutions Architect · Full-Stack Developer</title>

    <link rel="canonical" href="https://www.sebastianhernando.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sebastián Hernando — Solutions Architect · Full-Stack Developer" />
    <meta property="og:description" content="Next.js, Python y AWS — productos en producción usados por bancos y empresas en Australia y Panamá." />
    <meta property="og:image" content="https://www.sebastianhernando.dev/android-chrome-512x512.png" />
    <meta property="og:url" content="https://www.sebastianhernando.dev/" />
    <meta property="og:site_name" content="Sebastián Hernando" />
    <meta property="og:locale" content="es_ES" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sebastián Hernando — Solutions Architect · Full-Stack Developer" />
    <meta name="twitter:description" content="Next.js, Python y AWS — productos en producción usados por bancos y empresas en Australia y Panamá." />
    <meta name="twitter:image" content="https://www.sebastianhernando.dev/android-chrome-512x512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
