<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      No static title/description/OG here on purpose. This is a client-rendered SPA;
      react-helmet-async (src/features/common/seo/seo.tsx) owns all SEO tags per route
      and per locale at runtime (title, description, canonical, hreflang, Open Graph,
      Twitter Card). Helmet appends its tags instead of replacing static ones, so any
      tag hardcoded here would end up duplicated — with crawlers that read the first
      occurrence picking the wrong (generic) one. Google executes JS and reads Helmet's.
    -->
    <title>Sebastián Hernando</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
